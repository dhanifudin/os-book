name: Create Release with PDFs

on:
  release:
    types: [created]

jobs:
  build-full:
    name: Build Full Book (${{ matrix.lang }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        lang: [id, en]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache LaTeX packages
      uses: actions/cache@v4
      with:
        path: |
          /usr/share/texmf
          /usr/share/texlive
          /var/lib/texmf
        key: ${{ runner.os }}-texlive-${{ hashFiles('.github/workflows/release.yml') }}
        restore-keys: |
          ${{ runner.os }}-texlive-

    - name: Install LaTeX dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          texlive-latex-base \
          texlive-latex-extra \
          texlive-fonts-recommended \
          texlive-fonts-extra \
          texlive-lang-other \
          texlive-bibtex-extra \
          biber \
          latexmk \
          texlive-xetex \
          texlive-science

    - name: Build full book
      run: |
        make clean
        make ${{ matrix.lang }}

    - name: Rename PDF with release tag
      run: |
        VERSION=${{ github.event.release.tag_name }}
        cp main-${{ matrix.lang }}.pdf os-book-${{ matrix.lang }}-${VERSION}.pdf

    - name: Upload full book to release
      uses: softprops/action-gh-release@v2
      with:
        files: os-book-${{ matrix.lang }}-*.pdf
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-chapters:
    name: Build Chapter (${{ matrix.lang }}, ${{ matrix.chapter }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        lang: [id, en]
        chapter:
          - chapter01-introduction
          - chapter02-hardware-and-basic-commands
          - chapter03-basic-io
          - chapter04-directory-structure
          - chapter05-process-management
          - chapter06-bash-shell
          - chapter07-bash-programming
          - chapter08-memory-and-syscalls
          - chapter09-file-and-user-management
          - chapter10-service-management
          - chapter11-application-management
          - chapter12-backup-and-recovery

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache LaTeX packages
      uses: actions/cache@v4
      with:
        path: |
          /usr/share/texmf
          /usr/share/texlive
          /var/lib/texmf
        key: ${{ runner.os }}-texlive-${{ hashFiles('.github/workflows/release.yml') }}
        restore-keys: |
          ${{ runner.os }}-texlive-

    - name: Install LaTeX dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          texlive-latex-base \
          texlive-latex-extra \
          texlive-fonts-recommended \
          texlive-fonts-extra \
          texlive-lang-other \
          texlive-bibtex-extra \
          biber \
          latexmk \
          texlive-xetex \
          texlive-science

    - name: Build chapter
      run: |
        chmod +x scripts/build-chapter.sh
        ./scripts/build-chapter.sh ${{ matrix.lang }} ${{ matrix.chapter }}

    - name: Rename chapter PDF with release tag
      run: |
        VERSION=${{ github.event.release.tag_name }}
        SRC="output/chapters/chapter-${{ matrix.lang }}-${{ matrix.chapter }}.pdf"
        DEST="chapter-${{ matrix.lang }}-${{ matrix.chapter }}-${VERSION}.pdf"
        cp "$SRC" "$DEST"

    - name: Upload chapter to release
      uses: softprops/action-gh-release@v2
      with:
        files: chapter-${{ matrix.lang }}-${{ matrix.chapter }}-*.pdf
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
