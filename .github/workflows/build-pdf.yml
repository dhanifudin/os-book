name: Build LaTeX PDFs

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-full:
    name: Build Full Book (${{ matrix.lang }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lang: [id, en]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache LaTeX packages
      uses: actions/cache@v4
      with:
        path: |
          /usr/share/texmf
          /usr/share/texlive
          /var/lib/texmf
        key: ${{ runner.os }}-texlive-${{ hashFiles('.github/workflows/build-pdf.yml') }}
        restore-keys: |
          ${{ runner.os }}-texlive-

    - name: Install LaTeX dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          texlive-latex-base \
          texlive-latex-extra \
          texlive-fonts-recommended \
          texlive-fonts-extra \
          texlive-lang-other \
          texlive-bibtex-extra \
          biber \
          latexmk \
          texlive-xetex \
          texlive-science

    - name: Build full book
      run: |
        make clean
        make ${{ matrix.lang }}

    - name: Upload full book PDF
      uses: actions/upload-artifact@v4
      with:
        name: os-book-full-${{ matrix.lang }}
        path: main-${{ matrix.lang }}.pdf
        retention-days: 90

  build-chapters:
    name: Build Chapter (${{ matrix.lang }}, ${{ matrix.chapter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [id, en]
        chapter:
          - week01-introduction
          - week02-hardware-and-basic-commands
          - week03-basic-io
          - week05-directory-structure
          - week06-process-management
          - week07-bash-shell
          - week09-bash-programming
          - week10-memory-and-syscalls
          - week11-file-and-user-management
          - week12-service-management
          - week13-application-management
          - week14-backup-and-recovery

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache LaTeX packages
      uses: actions/cache@v4
      with:
        path: |
          /usr/share/texmf
          /usr/share/texlive
          /var/lib/texmf
        key: ${{ runner.os }}-texlive-${{ hashFiles('.github/workflows/build-pdf.yml') }}
        restore-keys: |
          ${{ runner.os }}-texlive-

    - name: Install LaTeX dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          texlive-latex-base \
          texlive-latex-extra \
          texlive-fonts-recommended \
          texlive-fonts-extra \
          texlive-lang-other \
          texlive-bibtex-extra \
          biber \
          latexmk \
          texlive-xetex \
          texlive-science

    - name: Build chapter
      run: |
        chmod +x scripts/build-chapter.sh
        ./scripts/build-chapter.sh ${{ matrix.lang }} ${{ matrix.chapter }}

    - name: Upload chapter PDF
      uses: actions/upload-artifact@v4
      with:
        name: chapter-${{ matrix.lang }}-${{ matrix.chapter }}
        path: output/chapters/chapter-${{ matrix.lang }}-${{ matrix.chapter }}.pdf
        retention-days: 90
